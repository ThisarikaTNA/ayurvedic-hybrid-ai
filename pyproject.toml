[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ayurvedic-hybrid-ai"
version = "0.1.0"
description = "Educational hybrid AI research prototype for Ayurvedic knowledge profiles"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==1.26.4",
    "pandas==2.2.2",
    "scipy==1.13.1",
    "scikit-learn==1.5.1",
    "threadpoolctl==3.5.0",
    "joblib==1.4.2",
    "openpyxl==3.1.5",
    "matplotlib==3.9.2",
    "seaborn==0.13.2",
]

[project.optional-dependencies]
dev = ["pytest==7.4.4"]

[tool.setuptools.packages.find]
where = ["src"]
